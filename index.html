<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bae's ROOM · 个人主页</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@200;300;400;500;600&display=swap">
  <link rel="preload" href="./assets/home/sky.webp" as="image">
  <link rel="stylesheet" href="./src/css/loading.css?v=bgpx-3">
  <link rel="stylesheet" href="./src/css/site.css?v=am-edit-3">
</head>
<body>
  <main class="stage" id="stage">
    <!-- 0 空白 → 红色先擦过 → 天蓝背景板盖上 -->
    <div class="wipe wipe--red"></div>
    <div class="wipe wipe--sky"></div>

    <!-- 背景元素：白色色块、半调网点、能量点列、白色墨点、星星和碎片，由 JS 生成 -->
    <svg class="bg" id="bg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <filter id="rough" x="-10%" y="-30%" width="120%" height="160%">
          <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="4"/>
          <feDisplacementMap in="SourceGraphic" scale="9"/>
        </filter>
        <filter id="splashS" x="-80%" y="-80%" width="260%" height="260%">
          <feTurbulence type="fractalNoise" baseFrequency=".35" numOctaves="2" seed="2"/>
          <feDisplacementMap in="SourceGraphic" scale="3"/>
        </filter>
        <filter id="splashL" x="-60%" y="-60%" width="220%" height="220%">
          <feTurbulence type="fractalNoise" baseFrequency=".12" numOctaves="3" seed="8"/>
          <feDisplacementMap in="SourceGraphic" scale="9"/>
        </filter>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="2.4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <pattern id="ht" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
          <circle cx="6.5" cy="6.5" r="2.4" fill="#fff"/>
        </pattern>
        <linearGradient id="htGrad">
          <stop offset="0" stop-color="#fff"/>
          <stop offset="1" stop-color="#000"/>
        </linearGradient>
        <mask id="htFade" maskContentUnits="objectBoundingBox">
          <rect width="1" height="1" fill="url(#htGrad)"/>
        </mask>
      </defs>
    </svg>

    <div class="grain" aria-hidden="true"></div>

    <!-- 临界阶段才出现的交叉警示条（参考《记忆管理局》的告警画面） -->
    <div class="hazard" aria-hidden="true"><i></i><i></i></div>

    <!-- 红色即将爆炸物 -->
    <div class="bomb" id="bomb" aria-hidden="true">
      <div class="bomb__shake">
        <div class="bomb__squash">
          <svg viewBox="-100 -100 200 200">
            <defs>
              <filter id="boil" x="-40%" y="-40%" width="180%" height="180%">
                <feTurbulence id="boilNoise" type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="1"/>
                <feDisplacementMap id="boilMap" in="SourceGraphic" scale="14" xChannelSelector="R" yChannelSelector="G"/>
              </filter>
              <filter id="haloBlur" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="9"/>
              </filter>
              <radialGradient id="bombFill" cx="38%" cy="36%" r="72%">
                <stop offset="0" stop-color="#FF6A8E"/>
                <stop offset=".5" stop-color="#FF0A3C"/>
                <stop offset="1" stop-color="#D60032"/>
              </radialGradient>
              <pattern id="bombDots" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
                <circle cx="3.5" cy="3.5" r="1.5" fill="#fff"/>
              </pattern>
              <linearGradient id="dotFade" x1="0" y1="0" x2="1" y2="1">
                <stop offset=".45" stop-color="#000"/>
                <stop offset="1" stop-color="#fff"/>
              </linearGradient>
              <mask id="dotMask"><circle r="62" fill="url(#dotFade)"/></mask>
            </defs>
            <circle class="bomb__halo" r="74" fill="#FF0A3C" opacity=".5" filter="url(#haloBlur)"/>
            <g class="bomb__ring">
              <circle r="84" fill="none" stroke="#fff" stroke-width="2.2" stroke-dasharray="18 10 4 10"/>
            </g>
            <g filter="url(#boil)">
              <circle r="58" fill="url(#bombFill)"/>
              <circle cx="-18" cy="16" r="34" fill="#FF4B86" opacity=".55"/>
              <circle cx="22" cy="-6" r="22" fill="#FF0A3C" opacity=".7"/>
              <circle r="58" fill="url(#bombDots)" mask="url(#dotMask)" opacity=".6"/>
              <circle cx="68" cy="-30" r="5" fill="#FF0A3C"/>
              <circle cx="-62" cy="46" r="4" fill="#FF4B86"/>
              <circle cx="54" cy="54" r="3" fill="#FF0A3C"/>
              <circle cx="-50" cy="-58" r="3" fill="#FF4B86"/>
              <circle id="bombFlash" r="60" fill="#fff" opacity="0"/>
            </g>
            <ellipse cx="-22" cy="-27" rx="14" ry="7" transform="rotate(-35 -22 -27)" fill="#fff" opacity=".85"/>
            <path class="bomb__spark" transform="translate(28 -36) scale(10)" fill="#fff"
              d="M0-1C.1-.15.15-.1 1 0 .15.1.1.15 0 1-.1.15-.15.1-1 0-.15-.1-.1-.15 0-1Z"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- HUD：锁定框、测量线、数值标签（参考《记忆管理局》剧中 UI） -->
    <div class="hud" aria-hidden="true">
      <div class="hud__line"></div>
      <div class="hud__lock"><i></i><i></i><i></i><i></i></div>
      <div class="hud__tag hud__tag--pressure"><b>PRESSURE</b><span data-pressure>000</span></div>
      <div class="hud__tag hud__tag--state"><span data-state>STABLE</span></div>
    </div>

    <!-- 内页（作品集、简历）后面的天空：Figma「Frame 8」（447:1348）导出的渐变天空，自带噪点 -->
    <div class="hero" aria-hidden="true">
      <div class="home-bg"></div>
    </div>


    <div class="burst" id="burst" aria-hidden="true"></div>
    <svg class="starburst" viewBox="-600 -600 1200 1200" aria-hidden="true"><g id="spikes"></g></svg>
    <div class="flash" aria-hidden="true"></div>


    <div class="label" aria-label="加载进度">
      <span class="label__pct"><b data-pct>000</b>%</span>
      <span class="label__row"><span>LOADING</span><span class="label__bar" data-bar>□□□□□□□□□□</span></span>
    </div>

    <!-- 开场掠过转场：前方白色，一条宽红带斜着扫过整屏，扫过的地方露出场景 -->
    <!-- 网站本体：loading 结束后出现（src/js/site.js，文字内容在 src/js/content.js） -->
    <div class="site" id="site" hidden>
      <header class="nav">
        <a class="nav__brand" href="#/home" data-cursor="HOME"><span class="dot-red"></span><span data-scramble>BAE'S ROOM</span></a>
      </header>

      <section class="page page--home" data-page="home" aria-label="首页">
        <!-- 主页是一张长滚动页（按 Figma「Frame 12」）：首屏 → 1 个人信息。
             所有元素按 1920 宽设计稿坐标排版：--u = 1/1920 屏宽，style 里的 --x/--y/--w 就是设计稿像素 -->
        <div class="hs-scroll" data-home-scroll>
          <section class="hs hs--hero" data-hero>
            <img class="hs__bg" src="./assets/home/bg-hero.webp" alt="">
            <!-- 首屏像素滤镜：每 n 像素取一个样点，膨胀成方块（屏幕像素）。
                 solid：整格（钢球、星星、土星环）；ht：网点，方块之间留缝、按透明度随机缺格，星芒柔和的尖端会变成稀疏的点 -->
            <svg class="px-defs" width="0" height="0" aria-hidden="true"><defs>
              <filter id="hpx3" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
                <feFlood x="0" y="0" width="2" height="2"/><feComposite width="3" height="3"/><feTile result="g"/>
                <feComposite in="SourceGraphic" in2="g" operator="in"/><feMorphology operator="dilate" radius="1"/>
              </filter>
              <filter id="hpx4" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
                <feFlood x="1" y="1" width="2" height="2"/><feComposite width="4" height="4"/><feTile result="g"/>
                <feComposite in="SourceGraphic" in2="g" operator="in"/><feMorphology operator="dilate" radius="2"/>
              </filter>
              <filter id="hpx6" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
                <feFlood x="2" y="2" width="2" height="2"/><feComposite width="6" height="6"/><feTile result="g"/>
                <feComposite in="SourceGraphic" in2="g" operator="in"/><feMorphology operator="dilate" radius="3"/>
              </filter>
              <filter id="hpx10" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
                <feFlood x="4" y="4" width="2" height="2"/><feComposite width="10" height="10"/><feTile result="g"/>
                <feComposite in="SourceGraphic" in2="g" operator="in"/><feMorphology operator="dilate" radius="5"/>
              </filter>
              <filter id="hpx-ht" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
                <feFlood x="3" y="3" width="1" height="1"/><feComposite width="7" height="7"/><feTile result="g"/>
                <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="1" seed="5" result="noise"/>
                <feComposite in="SourceAlpha" in2="noise" operator="arithmetic" k2="3" k3="-4.8" k4="1.2"/>
                <feComponentTransfer result="keep"><feFuncA type="discrete" tableValues="0 1"/></feComponentTransfer>
                <feComposite in="g" in2="keep" operator="in" result="dots"/>
                <feComposite in="SourceGraphic" in2="dots" operator="in"/>
                <feMorphology operator="dilate" radius="2"/>
              </filter>
            </defs></svg>
            <div class="hero-orb" data-orb>
              <img class="fx hero-orb__glow" style="--x:108;--y:11.1;--w:1059" src="./assets/home/glow.webp" alt="">
              <!-- 像素层：滤镜加在不转动的外层上，网格始终和屏幕对齐 -->
              <div class="px-layer px-layer--ht"><img class="fx hero-orb__spikes" style="--x:-15.1;--y:-132;--w:1233.1" src="./assets/home/spikes.webp" alt=""></div>
              <!-- 红球 ASCII 像素风（orb-pixels.js + orb-data.js）：柔光保留，球体画成一格一格的字符，球外圆点画成像素方块 -->
              <canvas class="fx hero-orb__bomb" style="--x:197;--y:129;--w:925.4;--h:945.4" data-orb-pixels aria-hidden="true"></canvas>
              <i class="orb-shine" aria-hidden="true"></i>
              <canvas class="hero-confetti" data-confetti aria-hidden="true"></canvas>
              <!-- 两圈土星环（Figma Ellipse 47 / 48），压在球的最上层；放在 .hero-orb 里，跟着球一起缩放，相对位置不变 -->
              <div class="px-layer px-layer--3">
                <img class="fx hero-orb__saturn" style="--x:253.3;--y:361.3;--w:706.1" src="./assets/home/sat1.webp" alt="">
                <img class="fx hero-orb__saturn" style="--x:257.1;--y:419.5;--w:713" src="./assets/home/sat2.webp" alt="">
              </div>
            </div>
            <button type="button" class="orb-hit" data-orb-hit data-cursor="POKE" aria-label="戳一下红球"></button>
            <div class="figma-stars" aria-hidden="true" data-depth=".15"><i style="--sx:36;--sy:72.1016;--sw:106;background-image:url(./assets/home/star-a.svg)"></i><i style="--sx:36;--sy:208.7129;--sw:106;background-image:url(./assets/home/star-b.svg)"></i><i style="--sx:37;--sy:345.3242;--sw:105;background-image:url(./assets/home/star-c.svg)"></i><i style="--sx:37;--sy:482;--sw:106;background-image:url(./assets/home/star-d.svg)"></i><i style="--sx:37;--sy:618.6113;--sw:106;background-image:url(./assets/home/star-e.svg)"></i><i style="--sx:38;--sy:755.2227;--sw:105;background-image:url(./assets/home/star-f.svg)"></i><i style="--sx:160;--sy:209;--sw:106;background-image:url(./assets/home/star-a.svg)"></i><i style="--sx:160;--sy:345.6113;--sw:106;background-image:url(./assets/home/star-b.svg)"></i><i style="--sx:161;--sy:482.2227;--sw:105;background-image:url(./assets/home/star-c.svg)"></i></div>
            <div class="px-layer px-layer--6">
              <img class="fx spin" data-depth=".45" style="--x:22;--y:362;--w:129" src="./assets/home/thinstar.webp" alt="" aria-hidden="true">
              <img class="fx spin" data-depth=".6" style="--x:167;--y:515;--w:87;animation-duration:9s;animation-direction:reverse" src="./assets/home/thinstar.webp" alt="" aria-hidden="true">
              <img class="fx roll" data-depth=".9" data-sheen style="--x:560;--y:198;--w:55;--roll:5s" src="./assets/home/ball1.webp" alt="" aria-hidden="true">
              <img class="fx roll" data-depth="1.2" data-sheen style="--x:312.1;--y:862.1;--w:46.6;--roll:4.2s;animation-direction:reverse" src="./assets/home/ball2.webp" alt="" aria-hidden="true">
              <img class="fx roll" data-depth=".75" data-sheen style="--x:1079.8;--y:833.1;--w:41.9;--roll:3.6s" src="./assets/home/ball3.webp" alt="" aria-hidden="true">
              <img class="fx hero-planet" data-depth=".6" data-sheen style="--x:1214;--y:201;--w:194.1" src="./assets/home/planet.webp" alt="" aria-hidden="true">
            </div>
            <h1 class="fx hero-title" style="--x:1100.8;--y:228.8;--w:756.3" data-hero-title><img src="./assets/home/title.webp" alt="Bae's Portfolio"></h1>
            <i class="hero-line" style="--y:238;--h:226"></i>
            <i class="hero-line" style="--y:511;--h:174"></i>
            <i class="hero-line" style="--y:759;--h:30"></i>
            <i class="hero-line" style="--y:814;--h:30"></i>
            <i class="hero-line" style="--y:868;--h:30"></i>
            <img class="fx hero-info" data-depth=".2" style="--x:1566;--y:528;--w:297" src="./assets/home/info.webp" alt="求职方向：游戏策划 | 交互设计；求职者：郑婷婷">
            <div class="hero-social">
              <!-- 点哪个图标就在左边出现哪个面板（坐标、尺寸照设计稿）；再点一次或点别处收起 -->
              <div class="fx sc" style="--x:1819;--y:755;--w:41">
                <button type="button" data-sc data-cursor="WECHAT" aria-label="微信二维码" aria-expanded="false"><img src="./assets/home/wechat.webp" alt=""></button>
                <div class="sc-pop sc-pop--qr" style="--px:1231;--py:464;--pw:499;--ph:514;--pr:0">
                  <img src="./assets/home/wechat-qr.webp?v=2" alt="Bae 的微信二维码，微信扫一扫添加好友">
                </div>
              </div>
              <div class="fx sc" style="--x:1828;--y:817;--w:24">
                <button type="button" data-sc data-cursor="GITHUB" aria-label="GitHub" aria-expanded="false"><img src="./assets/home/github.webp" alt=""></button>
                <div class="sc-pop sc-pop--center"><a href="#" data-github target="_blank" rel="noopener" data-cursor="OPEN">GitHub</a></div>
              </div>
              <div class="fx sc" style="--x:1828;--y:874;--w:27">
                <button type="button" data-sc data-cursor="MAIL" aria-label="邮箱" aria-expanded="false"><img src="./assets/home/mail.webp" alt=""></button>
                <div class="sc-pop" data-mail-list></div>
              </div>
            </div>
            <button type="button" class="hero-down" data-scroll-next data-cursor="SCROLL" aria-label="向下查看个人简介"><svg viewBox="0 0 100 70" fill="none" aria-hidden="true"><path d="M15 12L50 40L85 12M15 32L50 60L85 32"/></svg></button>
            <button type="button" class="scroll-hint" data-scroll-next data-cursor="SCROLL"><img src="./assets/home/hint.webp" alt="滑动以查看更多内容……"></button>
          </section>

          <!-- 1 个人信息：区块从设计稿 y=1239 开始，下面的坐标都减掉了 1239 -->
          <section class="hs hs--info" data-info>
            <img class="hs__bg" src="./assets/home/bg-info.webp" alt="">
            <img class="fx twinkle" style="--x:19;--y:297;--w:106" src="./assets/home/star.webp" alt="" aria-hidden="true">
            <img class="fx twinkle" style="--x:19;--y:424;--w:106;animation-delay:-1.1s" src="./assets/home/star.webp" alt="" aria-hidden="true">
            <img class="fx twinkle" style="--x:19;--y:552;--w:106;animation-delay:-2.2s" src="./assets/home/star.webp" alt="" aria-hidden="true">
            <h2 class="fx info-header" style="--x:906;--y:309;--w:978" data-info-header><img src="./assets/home/header.webp?v=2" alt="1 个人信息 Information"><span class="ip-px" data-header-px></span></h2>
            <img class="fx" style="--x:1314;--y:1076.9;--w:539.1" src="./assets/home/glow2.webp" alt="" aria-hidden="true">
            <i class="info-line106" aria-hidden="true"></i>
            <!-- 提示语（Figma 572:3，设计稿 1474, 2062）：滑到这里时像有人在打字一样逐字出现，打完光标闪烁 -->
            <p class="fx info-hint" style="--x:1474;--y:823" data-info-hint aria-label="点击任意模块查看信息"><span data-type aria-hidden="true"></span><i class="info-hint__caret" aria-hidden="true"></i></p>
            <canvas class="rain" data-rain aria-hidden="true"></canvas>

            <!-- 四个标签（设计稿里的模糊大字）：点标签或旁边的飞鸟都能打开对应的信息框 -->
            <div class="info-tabs" aria-label="个人信息分页">
              <button type="button" class="info-tab" data-tab="basic" data-cursor="BASIC INFO" aria-pressed="false">
                <img class="fx" style="--x:167.4;--y:1149.5;--w:203.9" src="./assets/home/lblBasic.webp" alt="Basic">
                <img class="fx" style="--x:164.5;--y:1197.5;--w:504.5" src="./assets/home/lblInfo.webp" alt="Information">
              </button>
              <button type="button" class="info-tab" data-tab="edu" data-cursor="EDUCATION" aria-pressed="false">
                <img class="fx" style="--x:463.1;--y:1494.5;--w:400.9" src="./assets/home/lblEdu.webp" alt="Education">
              </button>
              <button type="button" class="info-tab" data-tab="skills" data-cursor="SKILLS" aria-pressed="false">
                <img class="fx" style="--x:963.1;--y:1314;--w:275.9" src="./assets/home/lblSkills.webp" alt="SKILLS">
              </button>
              <button type="button" class="info-tab" data-tab="exp" data-cursor="EXPERIENCES" aria-pressed="false">
                <img class="fx" style="--x:1308.3;--y:1503.5;--w:489.8" src="./assets/home/lblExp.webp" alt="Experiences">
              </button>
            </div>

            <!-- 飞鸟：常驻扇翅，点哪只就打开哪一页 -->
            <button type="button" class="bird" style="--x:169;--y:936;--w:200" data-bird="basic" data-cursor="BASIC INFO" aria-label="个人信息"></button>
            <button type="button" class="bird" style="--x:564;--y:1278;--w:200;animation-delay:-.3s" data-bird="edu" data-cursor="EDUCATION" aria-label="教育经历"></button>
            <button type="button" class="bird" style="--x:960;--y:1004;--w:285;animation-delay:-.55s" data-bird="skills" data-cursor="SKILLS" aria-label="专业技能"></button>
            <button type="button" class="bird" style="--x:1422;--y:1215;--w:263;animation-delay:-.15s" data-bird="exp" data-cursor="EXPERIENCES" aria-label="飞往个人经历"></button>

            <!-- 信息框：每页按设计稿各自的位置摆放（深色毛玻璃 + 渐变描边 + 四角装饰 + 连接线 + 横线）。
                 默认都隐藏；内容由 site.js 按 content.js 填进 [data-pane] -->
            <!-- 每页：横线 + 连接线（从红色英文标签旁的像素方块出发，连到卡片）+ 卡片 + 外框装饰。
                 像素格子（.ip-px 里的 <i>）由 site.js 按设计稿坐标生成，每一颗各自不规则闪烁 -->
            <div class="ip" data-ip="basic" hidden>
              <img class="fx ip-lines" style="--x:-1;--y:927;--w:740" src="./assets/home/i_lines.webp" alt="">
              <svg class="ip-link" viewBox="0 0 1920 2478" preserveAspectRatio="none"><polyline pathLength="1" points="400,977 528,849 893,848"/></svg>
              <div class="fx ip-box" style="--x:893;--y:812;--w:879;--h:601"><div class="info-pane" data-pane="basic"></div></div>
              <img class="fx ip-frame" style="--x:869;--y:724;--w:923" src="./assets/home/i_frame.webp" alt="">
              <img class="fx ip-deco" style="--x:1635;--y:724;--w:210.8" src="./assets/home/pin.webp" alt="">
              <div class="ip-px"></div>
            </div>
            <div class="ip" data-ip="edu" hidden>
              <img class="fx ip-lines" style="--x:0;--y:1247;--w:1124" src="./assets/home/e_lines.webp" alt="">
